name = "amv"
description = "Machine vision library in Ada with proved SPARK kernels and a C API"
version = "0.2.0"
long-description = """
AdaMachineVision (AMV) is a machine vision library written in Ada. It has
images with coordinate space trees, shapes and regions, and vision tools: blob
analysis, calipers, line and circle finding, measuring and fitting, image
processing, correlation search, geometric pattern location, fixtures and
calibration.

The logic is written in SPARK and proved free of run-time errors, and the same
kernels are the C API. AMV uses no other library.
"""
authors = ["Go Komura"]
maintainers = ["Go Komura <contact@comcomponent.com>"]
maintainers-logins = ["gomurin0428"]
licenses = "PolyForm-Noncommercial-1.0.0 OR custom-commercial"
tags = ["vision", "image", "imageprocessing", "machinevision", "blob", "caliper"]
project-files = ["amv.gpr"]

[[depends-on]]
gnat = ">=16"

[configuration]
disabled = true
