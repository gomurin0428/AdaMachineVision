# Builds, tests and proves AdaMachineVision on Linux with the reference
# toolchain (GNAT 16.1, gprbuild 26, gnatprove 16.1 from the GNAT FSF
# builds), the same steps as before a pull request: make check, make test,
# make run-examples, make test-real-images, make run-real-image-examples
# and make prove. The proof is split into groups of kernels
# (tools/prove_groups.sh), each proved by its own job in parallel with the
# build and tests.

name: CI

# Feature branches are checked by their pull request runs only: a push run
# of a feature branch would repeat the same work, and its prover cache is
# not visible to the pull request runs anyway (a pull request run restores
# the caches of its own merge ref and of main). Pushes to main keep main's
# cache warm for every pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its run in progress; runs on main
# always finish, so that their prover caches are saved.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GNAT_RELEASE: gnat-16.1.0-1
  GNAT_ASSET: gnat-x86_64-linux-16.1.0-1.tar.gz
  GPRBUILD_RELEASE: gprbuild-26.0.0-1
  GPRBUILD_ASSET: gprbuild-x86_64-linux-26.0.0-1.tar.gz
  GNATPROVE_RELEASE: gnatprove-16.1.0-1
  GNATPROVE_ASSET: gnatprove-x86_64-linux-16.1.0-1.tar.gz

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/toolchain

      - name: make check (warnings as errors, thin Ada API)
        run: make check

      - name: make test (Ada and C API tests)
        run: make test

      - name: make run-examples (run the examples, check their reports)
        run: make run-examples

      # The real-image tests download images (pinned, checked by SHA-256)
      # and convert them to BMP with ImageMagick (python3, preinstalled,
      # unpacks the BBBC006 TIFFs and converts the barcode photographs).
      - name: Install ImageMagick (for the real-image tests)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q imagemagick

      # The downloads (more than a thousand files) are kept from run to
      # run, so that a run fetches only what a changed manifest adds. The
      # SHA-256 of every file is checked on every run all the same.
      - name: Restore the downloaded real images
        uses: actions/cache@v4
        with:
          path: build/real-images/raw
          key: real-images-${{ hashFiles('tests/real_images/*.txt') }}
          restore-keys: real-images-

      - name: make test-real-images (open images, targets and barcodes)
        run: make test-real-images

      - name: make run-real-image-examples (the examples on those images)
        run: make run-real-image-examples

      # Every kernel file must belong to a proof group (a new kernel falls
      # into "core"), and every group must have files.
      - name: Check the proof groups
        run: |
          tools/prove_groups.sh list | cut -d' ' -f1 | sort | uniq -c
          for group in shape-match calib-ncc filters geometry-measure \
                       dimensioning-tools code-reader core; do
            tools/prove_groups.sh "$group" > /dev/null
          done

  aravis-loopback:
    name: optional Aravis loopback tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/toolchain

      - name: Install Aravis development files
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libaravis-dev libusb-1.0-0-dev iproute2

      - name: Test the optional adapter with its loopback fake camera
        run: make test-aravis

  prove-aravis:
    name: optional adapter-local SPARK proof
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/toolchain

      - name: Prove the AMV-local GigE Vision spec and engine
        run: make prove-aravis

  aravis-loopback-windows:
    name: optional Aravis loopback tests (Windows)
    runs-on: windows-2022
    env:
      OS: Windows_NT
      ARAVIS_VERSION: "0.8.33"
      ARAVIS_TAG_COMMIT: "99081fbda9e820a171d2aaccea0bc95ba5f8c37b"
      ARAVIS_TARBALL_SHA256: "3c4409a12ea70bba4de25e5b08c777112de854bc801896594f2cb6f8c2bd6fbc"
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 MINGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: true
          path-type: minimal
          update: false
          install: >-
            make
            unzip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-zlib

      - name: Install Alire and the pinned GNAT toolchain
        run: |
          set -euo pipefail
          alr="$HOME/.local/bin/alr.exe"
          if [ ! -x "$alr" ]; then
            tmp=$(mktemp -d)
            trap 'rm -rf "$tmp"' EXIT
            curl -fsSL --retry 3 -o "$tmp/alr.zip" \
              https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-windows.zip
            printf '%s  %s\n' \
              863013b1f94da6f3b7d0d5a74022ac3370424eeea9a470ebdb33d188d61b9125 \
              "$tmp/alr.zip" | sha256sum -c -
            mkdir -p "$(dirname "$alr")"
            unzip -j "$tmp/alr.zip" bin/alr.exe -d "$(dirname "$alr")"
          fi
          "$alr" -n toolchain --select gnat_native=16.1.0 gprbuild=26.0.1

      - name: Check MINGW64 compiler target
        run: |
          set -euo pipefail
          mingw_target=$(gcc -dumpmachine)
          gnat_target=$("$HOME/.local/bin/alr.exe" -n exec -- gcc -dumpmachine \
            | tail -n 1 | tr -d '\r')
          printf 'MSYS2 GCC target: %s\nGNAT GCC target: %s\n' \
            "$mingw_target" "$gnat_target"
          test "$mingw_target" = "$gnat_target"

      - name: Build pinned Aravis 0.8.33 for MINGW64
        run: |
          set -euo pipefail
          printf 'Aravis %s, release commit %s\n' \
            "$ARAVIS_VERSION" "$ARAVIS_TAG_COMMIT"
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          archive="$tmp/aravis-${ARAVIS_VERSION}.tar.xz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/AravisProject/aravis/releases/download/${ARAVIS_VERSION}/aravis-${ARAVIS_VERSION}.tar.xz"
          printf '%s  %s\n' "$ARAVIS_TARBALL_SHA256" "$archive" | sha256sum -c -
          tar -xf "$archive" -C "$tmp"
          build_dir="$tmp/build"
          mingw_prefix=$(cygpath -m "$MINGW_PREFIX")
          CC=gcc CXX=g++ meson setup \
            "$build_dir" "$tmp/aravis-${ARAVIS_VERSION}" \
            --prefix="$mingw_prefix" --libdir=lib --buildtype=plain \
            -Ddocumentation=disabled -Dgst-plugin=disabled \
            -Dintrospection=disabled -Dusb=disabled \
            -Dpacket-socket=disabled -Dviewer=disabled -Dtests=false
          ninja -C "$build_dir" install
          test "$(pkg-config --modversion aravis-0.8)" = "$ARAVIS_VERSION"

      - name: Test the optional adapter with the loopback fake camera
        run: |
          set -euo pipefail
          export PATH="$MINGW_PREFIX/bin:$PATH"
          "$HOME/.local/bin/alr.exe" -n exec -- gnat --version
          "$HOME/.local/bin/alr.exe" -n exec -- gprbuild --version
          "$HOME/.local/bin/alr.exe" -n exec -- gcc --version
          pkg-config --modversion aravis-0.8
          "$HOME/.local/bin/alr.exe" -n exec -- make test-aravis

  prove:
    name: prove (${{ matrix.group }})
    runs-on: ubuntu-24.04
    # A group proved from scratch must fit in a hosted runner's 360
    # minutes; the whole project from scratch no longer does (more than
    # five hours in one job, 2026-11), which is why the proof is split.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        # The groups of tools/prove_groups.sh, its "core" included.
        group: [shape-match, calib-ncc, filters, geometry-measure,
                dimensioning-tools, code-reader, core]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/toolchain

      - name: Choose the prover cache directories
        run: |
          echo "PROVE_CACHE=$RUNNER_TEMP/gnatprove-cache" >> "$GITHUB_ENV"
          echo "PROVE_CACHE_TAR=$RUNNER_TEMP/gnatprove-cache.tar" >> "$GITHUB_ENV"

      # Prover results are cached by proof obligation (gnatprove
      # --memcached-server=file:DIR), so only obligations that changed are
      # proved again. The directory holds a great many small files, which
      # actions/cache fails to save ("Maximum call stack size exceeded"),
      # so it is kept as one tar file. Each group saves its own key (run id
      # and attempt) and restores the newest cache of the group made from
      # the same kernel sources, else the newest of the group, else the
      # newest cache of the whole project from before the split (its
      # results are valid for every group). It saves even after a failed or
      # timed-out proof, whose proved obligations stay valid.
      - name: Restore the prover cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PROVE_CACHE_TAR }}
          key: gnatprove-${{ matrix.group }}-tar-${{ env.GNATPROVE_RELEASE }}-${{ hashFiles('src/amv-kernels*.ads', 'src/amv-kernels*.adb', 'amv.gpr') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gnatprove-${{ matrix.group }}-tar-${{ env.GNATPROVE_RELEASE }}-${{ hashFiles('src/amv-kernels*.ads', 'src/amv-kernels*.adb', 'amv.gpr') }}-
            gnatprove-${{ matrix.group }}-tar-${{ env.GNATPROVE_RELEASE }}-
            gnatprove-tar-${{ env.GNATPROVE_RELEASE }}-

      - name: Unpack the prover cache
        run: |
          mkdir -p "$PROVE_CACHE"
          if [ -f "$PROVE_CACHE_TAR" ]; then
            tar -xf "$PROVE_CACHE_TAR" -C "$PROVE_CACHE"
          fi
          echo "prover cache: $(find "$PROVE_CACHE" -type f | wc -l) files"

      - name: make prove (the group's kernels)
        timeout-minutes: 300
        run: |
          make prove PROVE_CACHE="$PROVE_CACHE" \
            PROVE_UNITS="$(tools/prove_groups.sh ${{ matrix.group }})"

      - name: Pack the prover cache
        if: always()
        run: |
          if [ -d "$PROVE_CACHE" ]; then
            tar -cf "$PROVE_CACHE_TAR" -C "$PROVE_CACHE" .
            ls -l "$PROVE_CACHE_TAR"
          fi

      - name: Save the prover cache
        if: always() && env.PROVE_CACHE_TAR != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PROVE_CACHE_TAR }}
          key: gnatprove-${{ matrix.group }}-tar-${{ env.GNATPROVE_RELEASE }}-${{ hashFiles('src/amv-kernels*.ads', 'src/amv-kernels*.adb', 'amv.gpr') }}-${{ github.run_id }}-${{ github.run_attempt }}
